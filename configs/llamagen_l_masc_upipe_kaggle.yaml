# LlamaGen-L + MASC + UPipe — Kaggle Free Tier (2× T4 16 GB each)
# ---------------------------------------------------------------
# Designed for proof-of-concept fine-tuning from a pretrained
# LlamaGen-L checkpoint (c2i_L_256.pt, ~1.4 GB) on pre-extracted
# ImageNet-1K token codes (vq_ds16_c2i.pt pipeline, ~8-12 GB).
#
# Memory budget per T4:
#   - LlamaGen-L (343M params) fp16  ~  700 MB weights
#   - MASC k=4096 vocab              ~  saved ~100 MB vs k=8192
#   - UPipe chunk_heads=4            ~  ~4x peak VRAM reduction in attn
#   - grad_checkpointing             ~  ~30% further VRAM saving
#   - batch_size=8 + grad_accum=16   ~  effective batch = 128

backbone:
  name: llamagen_l
  params: 343M
  image_size: 256
  tokenizer: llamagen_vq16384
  pretrained: /kaggle/working/weights/c2i_L_256.pt  # Auto-downloaded by Cell 2
  freeze_layers: 0    # Full unfreeze 24 layers: all layers adapt specifically to target classes

masc:
  k: 4096              # Coarse vocabulary k=4096 (Algorithm 1)
  decode: random_sampling

upipe:
  enabled: true
  chunk_heads: 4       # LlamaGen-L has 16 heads -> U=4 stages -> ~4x VRAM saving
  use_flash: true      # Flash-Attention 2 within each chunk (T4 supports it)

optimizer:
  name: adamw
  peak_lr: 1.0e-4      # Optimal LR for full backbone fine-tuning (paper Table 8)
  final_lr: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.05

train:
  epochs: 1.0          # Exactly 1 full epoch over ImageNet (~1.28M images, ~40,000 steps)
  total_steps: null    # Computed dynamically from dataset size & batch size
  global_batch_size: 32
  local_batch_size: 16 # 16 per GPU x 2 GPUs = 32/step (12.4 GB VRAM rock-solid khi unfreeze 24 tầng)
  grad_clip: 1.0
  amp: true            # bf16 preferred; T4 uses fp16
  amp_dtype: float16
  ckpt_every: 2500     # Save rolling checkpoint every 2500 steps (~35 min)
  grad_checkpointing: true

num_workers: 4          # Maximize 4 Kaggle vCPUs for fast pipeline data loading
log_every: 50           # Log step progress and epoch fraction every 50 steps
